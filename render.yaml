services:
  - type: web
    name: resqroute-api
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: "/var/data/resqroute.db"
      - key: MODEL_PATH
        value: "backend/ai/models/resqroute_unet_resnet34_v2_best.pth"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
